name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  # A release build must refuse to be signed with the debug key. The guard
  # trips while Gradle builds its task graph, before anything compiles, so this
  # fails in seconds once Flutter has set Gradle up; it breaks if the guard in
  # android/app/build.gradle.kts is ever removed.
  release-signing-guard:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.1'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Without key.properties a release build must fail
        run: |
          if flutter build apk --release > guard.log 2>&1; then
            echo "::error::A release build was allowed without android/key.properties (it would be signed with the debug key)."
            exit 1
          fi
          grep -q "signed with the DEBUG key" guard.log || { echo "::error::It failed, but not because of the signing guard:"; tail -40 guard.log; exit 1; }
          echo "guard works"
