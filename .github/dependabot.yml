# Weekly dependency updates. CI (analyze + tests) vets each pull request.
# Major versions of Flutter plugins are left for a person to take on purpose:
# several (notifications, purchases) change platform behaviour.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    labels: [dependencies]
