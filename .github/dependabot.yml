# Weekly dependency updates. CI (analyze + tests) vets each pull request.
# Major versions of Flutter plugins are left for a person to take on purpose:
# several (notifications, purchases) change platform behaviour.
version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # 3.3 cannot resolve together with easy_localization's intl constraint
      # (pub fails). Revisit when easy_localization moves.
      - dependency-name: table_calendar
        versions: [">=3.3.0"]
      # intl is pinned by the Flutter SDK's flutter_localizations; a newer
      # version in pubspec fails to resolve.
      - dependency-name: intl
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    labels: [dependencies]
